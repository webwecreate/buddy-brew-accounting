<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Buddy Brew Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --brand: #AC1C1A; --brand-ink: #ffffff; --cream: #F5F0EA;
    --surface-0: #F5F0EA; --surface-1: #fcfcfb; --surface-2: #efe9e1;
    --text-primary: #1d1b19; --text-secondary: #55524d; --text-muted: #85817a;
    --border: #e4ddd3; --grid: #ece7df;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --gov-ink: #1f6fd1; --ch-green: #0a7f3f;
    --seq-0: #f3efe9; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95;
    --good: #0b7d0b; --critical: #c23030; --warn-bg: #fff4dc; --warn-ink: #7a5200;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --brand: #d8433f; --surface-0: #141312; --surface-1: #1d1c1a; --surface-2: #272522;
      --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8d86;
      --border: #34322e; --grid: #2a2926;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --gov-ink: #6aa8f0; --ch-green: #0a7f3f;
      --seq-0: #22211f; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #9ec5f4;
      --good: #3fbf3f; --critical: #e66767; --warn-bg: #3a2f14; --warn-ink: #f5d48a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --brand: #d8433f; --surface-0: #141312; --surface-1: #1d1c1a; --surface-2: #272522;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8d86;
    --border: #34322e; --grid: #2a2926;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --gov-ink: #6aa8f0; --ch-green: #0a7f3f;
    --seq-0: #22211f; --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #2a78d6; --seq-5: #5598e7; --seq-6: #9ec5f4;
    --good: #3fbf3f; --critical: #e66767; --warn-bg: #3a2f14; --warn-ink: #f5d48a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary); font-family: "Kanit", -apple-system, "Segoe UI", sans-serif; font-weight: 300; font-size: 15px; line-height: 1.5; }
  button, select, input { font-family: inherit; font-size: 14px; color: var(--text-primary); }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  /* header */
  header { position: sticky; top: 0; z-index: 20; background: var(--brand); color: var(--brand-ink); }
  .hbar { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .logo { font-weight: 600; font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  .logo small { font-weight: 300; opacity: .85; font-size: 13px; margin-left: 6px; }
  .hbar .spacer { flex: 1; }
  .hbar select { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 10px; padding: 6px 10px; }
  .hbar select option { color: #1d1b19; }
  .hbar a, .hbar .linkbtn { color: #fff; text-decoration: none; font-size: 13px; opacity: .9; background: none; border: 0; padding: 4px; white-space: nowrap; }
  nav.tabs { max-width: 1240px; margin: 0 auto; padding: 0 12px; display: flex; gap: 4px; }
  nav.tabs button { background: none; border: 0; color: rgba(255,255,255,.8); padding: 8px 14px 10px; font-size: 15px; border-bottom: 3px solid transparent; }
  nav.tabs button.active { color: #fff; border-bottom-color: #fff; font-weight: 500; }
  main { max-width: 1240px; margin: 0 auto; padding: 16px 16px 96px; }
  .fresh { font-size: 12.5px; color: var(--text-muted); margin: 0 0 12px; }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  h2 { font-size: 17px; font-weight: 500; margin: 0 0 4px; }
  h3 { font-size: 15px; font-weight: 500; margin: 0 0 2px; }
  .sub { font-size: 12.5px; color: var(--text-muted); margin: 0 0 10px; }
  .grid { display: grid; gap: 12px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 12px; }
  .two { grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } .two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
  .kpi .label { font-size: 13px; color: var(--text-secondary); }
  .kpi .value { font-size: 24px; font-weight: 500; line-height: 1.25; margin-top: 2px; }
  .kpi .delta { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
  .delta .up { color: var(--good); } .delta .down { color: var(--critical); }
  .neg { color: var(--critical); }
  .good { color: var(--good); font-size: 12px; white-space: nowrap; } .bad { color: var(--critical); font-size: 12px; white-space: nowrap; }
  .progress { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; margin: 10px 0 6px; position: relative; }
  .progress > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--series-1); border-radius: 6px; }
  .progress > i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text-primary); }
  .pwrap { position: relative; padding-top: 18px; }
  .pwrap .tl { position: absolute; top: 0; font-size: 11.5px; line-height: 16px; color: var(--text-primary); white-space: nowrap; }
  .pwrap .tl::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 2px; height: 4px; background: var(--text-primary); }
  .pwrap.two { padding-bottom: 18px; }
  .pwrap .tl.b { top: auto; bottom: 0; color: var(--text-secondary); }
  .pwrap .tl.b::after { bottom: auto; top: -4px; background: var(--text-secondary); }
  .progress > i.b { background: var(--text-secondary); }
  .chart-box { position: relative; height: 260px; }
  .chart-box.tall { height: 320px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-secondary); margin: 2px 0 8px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--c); vertical-align: middle; margin-right: 6px; }
  .legend .sq::before { width: 10px; height: 10px; border-radius: 3px; }
  .ch { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; line-height: 1; padding: 3px 6px 2px; border-radius: 4px; color: #fff; background: var(--ch-green); vertical-align: 1px; white-space: nowrap; }
  .ch-gov { color: var(--gov-ink); font-weight: 500; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-weight: 500; color: var(--text-secondary); font-size: 12.5px; position: sticky; top: 0; background: var(--surface-1); }
  td.r, th.r { text-align: right; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .scroll.maxh { max-height: 460px; overflow-y: auto; }
  .tag { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 8px; background: var(--surface-2); color: var(--text-secondary); }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 8px; font-size: 13px; color: var(--text-secondary); }
  .seg button.on { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .rowflex { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .lines div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .lines div:last-child { border-bottom: 0; }
  .lines .total { font-weight: 500; border-top: 1px solid var(--text-muted); border-bottom: 0; margin-top: 4px; }
  /* heatmap */
  .heat { display: grid; gap: 2px; font-size: 11px; }
  .heat .h { color: var(--text-muted); text-align: center; }
  .heat .d { color: var(--text-secondary); padding-right: 4px; display: flex; align-items: center; }
  .heat .c { height: 26px; border-radius: 4px; background: var(--seq-0); outline: none; }
  .heat .c:hover, .heat .c:focus { box-shadow: 0 0 0 2px var(--text-primary); }
  .scale { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-muted); margin-top: 8px; }
  .scale i { width: 22px; height: 10px; border-radius: 3px; display: inline-block; }
  #tip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; max-width: 240px; }
  #tip strong { font-weight: 500; }
  /* login */
  #login { max-width: 380px; margin: 12vh auto; padding: 0 16px; }
  #login .card { padding: 22px; }
  #login input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); margin-bottom: 10px; }
  .btn { background: var(--brand); color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 500; width: 100%; }
  .err { color: var(--critical); font-size: 13px; margin-top: 8px; }
  .loading { text-align: center; color: var(--text-muted); padding: 40px 0; }
  /* mobile: tabs move to a bottom bar */
  @media (max-width: 759px) {
    .logo small { display: none; }
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface-1); border-top: 1px solid var(--border); padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); max-width: none; justify-content: space-around; }
    nav.tabs button { color: var(--text-muted); border-bottom: 0; border-top: 3px solid transparent; padding: 9px 1px; font-size: 13px; flex: 1; white-space: nowrap; min-width: 0; }
    nav.tabs button.active { color: var(--brand); border-top-color: var(--brand); }
    .kpi .value { font-size: 20px; }
    .hbar a.back { display: none; }
  }
  /* simple bar list (beans / matcha) */
  .barrow { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 8px; align-items: center; padding: 5px 0; font-size: 13.5px; }
  .barrow .bt { display: flex; gap: 2px; height: 12px; }
  .barrow .bt span { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 0; }
  .barrow .bt span:first-child { border-radius: 4px 0 0 4px; }
  .barrow .bv small { color: var(--text-muted); font-size: 11.5px; margin-left: 4px; }
  .barrow:hover, .barrow:focus { background: var(--surface-2); outline: none; border-radius: 6px; }
  /* P&L table */
  table.pnl td:first-child, table.pnl th:first-child { position: sticky; left: 0; background: var(--surface-1); z-index: 1; white-space: nowrap; }
  table.pnl tr.grp td { font-weight: 500; color: var(--text-secondary); padding-top: 14px; border-bottom: 0; }
  table.pnl tr.sum td { font-weight: 500; border-top: 1px solid var(--text-muted); }
  table.pnl tr.total td { font-size: 14.5px; }
  table.pnl tr.memo td { color: var(--text-secondary); font-style: italic; }
  table .sel { background: var(--surface-2) !important; }
  tr.sum td { font-weight: 500; }
  /* drill-down */
  details { border-top: 1px solid var(--border); }
  details summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 10px; padding: 9px 2px; font-size: 14px; }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸"; color: var(--text-muted); margin-right: 6px; transition: transform .15s; display: inline-block; }
  details[open] summary::before { transform: rotate(90deg); }
  details summary .l { flex: 1; }
  details .scroll { margin-bottom: 10px; }
  a.more { font-size: 12.5px; color: var(--series-1); text-decoration: none; }
  /* simulator */
  .simctl { margin: 10px 0 12px; }
  .simctl label { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 4px; }
  .simctl strong { font-weight: 500; }
  .simctl input[type=range] { width: 100%; accent-color: var(--series-1); height: 28px; }
  .simrange { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-top: -4px; }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; margin-top: 6px; }
  .simres { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .simres > .num { font-size: 22px; font-weight: 500; }
  .good-big { color: var(--good); }
  nav.groups { max-width: 1240px; margin: 0 auto; padding: 0 16px 8px; display: flex; gap: 6px; }
  nav.groups button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 999px; padding: 4px 14px; font-size: 13px; }
  nav.groups button.on { background: #fff; color: var(--brand); border-color: #fff; font-weight: 500; }
  .toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .xbtn { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }
  .kind { font-size: 12.5px; color: var(--text-secondary); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; margin: 0 0 12px; }
  .kind b { font-weight: 500; color: var(--text-primary); }
  @media (forced-colors: active) { .progress > span, .heat .c { forced-color-adjust: none; } }
</style>
</head>
<body>
<div id="login" hidden>
  <div class="card">
    <h2>Buddy Brew Dashboard</h2>
    <p class="sub">เข้าสู่ระบบด้วยบัญชีเดียวกับเว็บบัญชี</p>
    <form id="login-form">
      <input id="email" type="email" placeholder="อีเมล" autocomplete="username" required>
      <input id="password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" required>
      <button class="btn" type="submit">เข้าสู่ระบบ</button>
      <div class="err" id="login-err" hidden></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="hbar">
      <div class="logo">Buddy Brew<small>ภาพรวมร้าน</small></div>
      <div class="spacer"></div>
      <select id="month" aria-label="เลือกเดือน"></select>
      <a class="back" href="accounting.html">หลังบ้าน</a>
      <button class="linkbtn" id="logout">ออก</button>
    </div>
    <nav class="groups" aria-label="ประเภทบัญชี"><button data-group="mgmt">บัญชีบริหาร</button><button data-group="fin">บัญชีการเงิน</button></nav>
    <nav class="tabs" role="tablist"></nav>
  </header>
  <main>
    <div class="toprow"><p class="fresh" id="fresh"></p><button class="xbtn" id="export" title="ดาวน์โหลดทุกตารางในหน้านี้เป็นไฟล์ Excel">⬇ Excel หน้านี้</button></div>
    <div id="view" class="loading">กำลังโหลดข้อมูล…</div>
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script>
'use strict';
const SUPABASE_URL = 'https://xsokynhtoxktazlomsnx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_r-BdEYs8q61oSQKv_qJpPw_Xh5BPgRa';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// Local preview only: ?mock=<json file> is honoured on localhost, never on the published site.
const IS_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const MOCK_URL = IS_LOCAL ? new URLSearchParams(location.search).get('mock') : null;

const TH_MONTH = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const TH_DAY = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const D = {};            // loaded data
let state = { tab: 'overview', month: null, salesRange: 3, menuRange: 'month', menuSort: 'profit', goalLevel: 1, beanLevel: 'all' };
try { const g = Number(localStorage.getItem('bb-dash-goal')); if (g >= 1 && g <= 4) state.goalLevel = g; const r = localStorage.getItem('bb-dash-roast'); if (['all', 'light', 'medium', 'dark'].includes(r)) state.beanLevel = r; } catch (_) {}
let charts = [];

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const nf0 = new Intl.NumberFormat('th-TH', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const baht = n => nf0.format(Math.round(n || 0));
const pct = n => (n == null || !isFinite(n)) ? '–' : nf0.format(Math.round(n * 100)) + '%';
const num = v => Number(v) || 0;
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function ym(dateStr) { return dateStr.slice(0, 7); }
function monthLabel(m) { const [y, mm] = m.split('-').map(Number); return `${TH_MONTH[mm - 1]} ${String(y + 543).slice(2)}`; }
function monthLabelLong(m) { const [y, mm] = m.split('-').map(Number); return `${TH_MONTH[mm - 1]} ${y + 543}`; }
function addMonths(m, k) { let [y, mm] = m.split('-').map(Number); mm += k; while (mm < 1) { mm += 12; y--; } while (mm > 12) { mm -= 12; y++; } return `${y}-${String(mm).padStart(2, '0')}`; }
function daysInMonth(m) { const [y, mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); }
function weekday(dateStr) { const [y, m, d] = dateStr.split('-').map(Number); return new Date(y, m - 1, d).getDay(); }
function dayLabel(dateStr) { const d = Number(dateStr.slice(8, 10)); return `${d} ${TH_DAY[weekday(dateStr)]}`; }
function thDate(dateStr) { if (!dateStr) return '–'; return `${Number(dateStr.slice(8, 10))} ${monthLabelLong(dateStr.slice(0, 7))}`; }
const ASSET_CAT = { equipment: 'อุปกรณ์/เครื่องใช้', decor: 'ตกแต่งร้านและป้าย', furniture: 'เฟอร์นิเจอร์', renovation: 'ปรับปรุงร้าน', electronics: 'อิเล็กทรอนิกส์' };
function deltaHtml(cur, prev, label) {
  if (!prev) return `<div class="delta">${label}: –</div>`;
  const ch = (cur - prev) / Math.abs(prev);
  return `<div class="delta">${label} <span class="${ch >= 0 ? 'up' : 'down'}">${ch >= 0 ? '▲' : '▼'} ${pct(Math.abs(ch))}</span></div>`;
}

// ---------- tooltip ----------
const tip = $('#tip');
function showTip(html, x, y) { tip.innerHTML = html; tip.style.display = 'block'; const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.min(window.innerWidth - w - 8, x + 12) + 'px'; tip.style.top = Math.max(8, y - h - 12) + 'px'; }
function hideTip() { tip.style.display = 'none'; }

// ---------- data ----------
async function fetchAll(table, select = '*', order) {
  if (D.__mock) return D.__mock[table] || [];
  const out = []; const step = 1000;
  for (let from = 0; ; from += step) {
    let q = sb.from(table).select(select).range(from, from + step - 1);
    if (order) q = q.order(order);
    const { data, error } = await q;
    if (error) throw new Error(`${table}: ${error.message}`);
    out.push(...data);
    if (data.length < step) break;
  }
  return out;
}

async function loadData() {
  if (MOCK_URL) D.__mock = await (await fetch(MOCK_URL, { cache: 'no-store' })).json();
  const [daily, hourly, menuSales, optionSales, fixedItems, settings, closures, expenseItems, categories, menuCosts, expenses, assets, liabilities, accounts, targets, balances, ownerEntries, liabPayments, promos, invCounts, beanPeriods, beanMap] = await Promise.all([
    fetchAll('v_sales_daily', '*', 'business_date'),
    fetchAll('v_sales_hourly', '*'),
    fetchAll('v_menu_sales', '*'),
    fetchAll('v_option_sales', '*'),

function normName(s) {
  let n = String(s || '').toLowerCase().replace(/\(ปัจจุบัน[^)]*\)/g, '').replace(/\s+/g, ' ').trim();

}
function buildCostIndex(rows) {

}

}

function monthDays(m) { return D.daily.filter(r => ym(r.business_date) === m); }

// month-by-month: store sales per open day vs the two break-even ticks vs the P&L net (before owner salary)
function goalHistory(upto) {
  const util = D.categories.find(c => /utilit|electric|water/i.test(c.key || ''));
  const rows = D.months.filter(x => x <= upto).map(x => {
    const s = salesOfMonth(x), l = ladder(x), p = pnlOfMonth(x), sd = s.openDays ? s.store / s.openDays : 0;
    const notes = [];
    if (l.trial) notes.push('เดือนทดลอง ซื้อของเข้าร้านครั้งแรก');
    if (l.basis === 'plan') notes.push('เดือนยังไม่จบ');
    if (util && !p.cats[util.key]) notes.push('ยังไม่มีบิลค่าน้ำไฟ');
    if (D.lastExpense && x >= ym(D.lastExpense)) notes.push('บิลซื้อยังลงไม่ครบ');
    const mark = v => sd >= v ? '✓' : '✗';
    return `<tr><td>${monthLabel(x)}</td><td class="r">${s.openDays}</td><td class="r">${baht(sd)}</td><td class="r">${mark(l.levels[0].perDay)} ${baht(l.levels[0].perDay)}</td><td class="r">${mark(l.bookPerDay)} ${baht(l.bookPerDay)}</td><td class="r ${p.net < 0 ? 'neg' : ''}">${baht(p.net)}</td><td style="white-space:normal;color:var(--text-muted)">${notes.join(' · ')}</td></tr>`;
  });
  return `<div class="scroll"><table class="num"><thead><tr><th>เดือน</th><th class="r">วันเปิด</th><th class="r">หน้าร้าน/วัน</th><th class="r">ค่าใช้จ่ายครบ</th><th class="r">รวมค่าเสื่อม</th><th class="r">กำไรสุทธิในงบ</th><th>เหตุที่อาจไม่ตรง</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>
    <p class="sub" style="margin-top:6px">ขีดคิดจากต้นทุนตามสูตร (กำไรส่วนเกิน ${pct(ladder(upto).ratio)}) + ซื้อเกินเฉลี่ย ส่วนงบกำไรขาดทุนคิดจากบิลซื้อจริงทั้งเดือน (ยังไม่มีนับสต็อก) จึงต่างกันได้ในเดือนที่ซื้อของเข้าสต็อกมาก/น้อย · เดือนที่จบแล้วคิดขีดจากวันที่เปิดจริง · กำไรสุทธิในงบ = ก่อนเงินเดือนเจ้าของ</p>`;
}
// milestone ladder (Reporting-Direction §10): store sales per open day needed for each level
const LEVELS = [
  { id: 0, short: 'ค่าใช้จ่ายครบ', parts: [] },
  { id: 1, parts: ['salary_low'] },
  { id: 2, parts: ['salary_target'] },
  { id: 3, parts: ['salary_target', 'owner_debt_repay'] },
  { id: 4, parts: ['salary_target', 'owner_debt_repay', 'rent'] },
];
function setting(k) { const r = D.settings.find(x => x.key === k); return r ? num(r.value) : null; }
function kNum(n) { return n >= 1000 ? `${nf1.format(n / 1000).replace(/\.0$/, '')}k` : nf0.format(n); }
function ladder(m) {
  const netCup = setting('net_per_cup'), contrib = setting('contribution_per_cup');
  if (!netCup || !contrib) return null;
  const fixedItems = fixedPlanned(m), fixed = fixedItems.reduce((a, f) => a + num(f.monthly_amount), 0);
  // finished months: spread the month's costs over the days really opened (e.g. trial month May 2026 opened 16 days);
  // the current month still uses the planned open days
  const plan = planDays(m, targetFor(m)), act = salesOfMonth(m).openDays, done = !!D.lastSale && m < ym(D.lastSale);
  const days = done && act ? act : plan, basis = done && act ? 'actual' : 'plan';
  const over = setting('overbuy_monthly') || 0, ratio = contrib / netCup, dep = depreciationOfMonth(m);
  const sl = setting('salary_low') || 0, st = setting('salary_target') || 0, debt = setting('owner_debt_repay') || 0, rent = setting('rent') || 0;
  const names = [
    ['ค่าใช้จ่ายครบ', 'จ่ายค่าใช้จ่ายเงินสดครบ (ยังไม่มีเงินเดือน)'],
    [`เงินเดือน ${kNum(sl)}`, `+ เงินเดือน ${baht(sl)}`],
    [`เงินเดือน ${kNum(st)}`, `+ เงินเดือน ${baht(st)}`],
    ['+ คืนหนี้เจ้าของ', `+ เงินเดือน ${baht(st)} + คืนหนี้เจ้าของ ${baht(debt)}/เดือน`],
    ['+ ค่าเช่า', `+ เงินเดือน ${baht(st)} + คืนหนี้ ${baht(debt)} + ค่าเช่า ${baht(rent)} (จำลองย้ายที่/ขยายร้าน)`],
  ];
  const levels = LEVELS.map((L, i) => {
    const extra = L.parts.reduce((a, k) => a + (setting(k) || 0), 0), need = fixed + over + extra, perDay = need / days / ratio;
    return { ...L, short: names[i][0], label: names[i][1], need, perDay, cups: perDay / netCup };
  });
  // accounting break-even: cash costs + depreciation (passing it means net profit before owner salary should not be negative in a normal month)
  const bookPerDay = (fixed + over + dep) / days / ratio;
  return { levels, fixed, fixedItems, over, ratio, contrib, netCup, days, planDays: plan, basis, dep, bookPerDay, trial: m === D.months[0], grabPerOrder: setting('grab_contribution_per_order') || 0 };
}

function renderOptions(months) {
  for (const kind of ['bean', 'matcha']) {
    const agg = new Map();
    const src = kind === 'bean'
      ? D.beanSales.map(x => ({ business_date: x.date, channel: x.channel, qty: x.qty, name: x.label, detail: x.level ? ROAST[x.level] : x.detail, opt: x.opt }))
      : D.optionSales.filter(r => r.kind === kind);
    for (const r of src) {
      if (!months.includes(ym(r.business_date))) continue;
      const a = agg.get(r.name) || { name: r.name, detail: r.detail, store: 0, grab: 0, opts: new Set() };
      if (r.channel === 'grab') a.grab += num(r.qty); else a.store += num(r.qty);
      if (r.detail) a.detail = r.detail; if (r.opt) a.opts.add(r.opt); agg.set(r.name, a);
    }
    const rows = [...agg.values()].sort((a, b) => (b.store + b.grab) - (a.store + a.grab));
    const total = rows.reduce((t, r) => t + r.store + r.grab, 0);
    const el = $('#opt-' + kind);
    if (!rows.length) { el.innerHTML = '<p class="sub">ไม่มีข้อมูลตัวเลือกนี้ในช่วงที่เลือก</p>'; continue; }
    const max = Math.max(...rows.map(r => r.store + r.grab));
    el.innerHTML = `${legend([[css(CHC.walk), 'หน้าร้าน', 1], [css(CHC.grab), CH.grab, 1, 1]])}<div class="bars">` + rows.map(r => {
      const tot = r.store + r.grab;
      return `<div class="barrow" tabindex="0" data-tip="${esc(`<strong>${nf0.format(tot)} แก้ว</strong> (${pct(tot / total)})<br>หน้าร้าน ${nf0.format(r.store)} · Grab ${nf0.format(r.grab)}${r.opts.size ? `<br><span style="color:var(--text-muted)">POS: ${[...r.opts].join(', ')}</span>` : ''}`)}">
        <div class="bl">${esc(r.name)}${r.detail ? ` <span class="tag">${esc(r.detail)}</span>` : ''}</div>
        <div class="bt"><span style="width:${r.store / max * 100}%;background:var(${CHC.walk})"></span><span style="width:${r.grab / max * 100}%;background:var(${CHC.grab})"></span></div>
        <div class="bv num">${nf0.format(tot)} <small>${pct(tot / total)}</small></div></div>`;
    }).join('') + '</div>';
    el.addEventListener('pointermove', e => { const b = e.target.closest('.barrow'); if (b) showTip(b.dataset.tip, e.clientX, e.clientY); });
    el.addEventListener('pointerleave', hideTip);
  }
  // monthly trend table
  const allMonths = D.months.filter(x => x <= state.month);
  const names = { bean: new Map(), matcha: new Map() };
  const lvlOf = new Map();
  for (const r of D.optionSales) { if (r.kind !== 'matcha' || !allMonths.includes(ym(r.business_date))) continue; const mm = names.matcha; const o = mm.get(r.name) || {}; o[ym(r.business_date)] = (o[ym(r.business_date)] || 0) + num(r.qty); mm.set(r.name, o); }
  for (const x of D.beanSales) { if (!allMonths.includes(ym(x.date))) continue; const o = names.bean.get(x.label) || {}; o[ym(x.date)] = (o[ym(x.date)] || 0) + x.qty; names.bean.set(x.label, o); lvlOf.set(x.label, x.level); }
  let h = `<table class="num"><thead><tr><th>ตัวเลือก</th>${allMonths.map(x => `<th class="r">${monthLabel(x)}</th>`).join('')}</tr></thead><tbody>`;
  for (const [kind, title] of [['bean', 'เมล็ดกาแฟ'], ['matcha', 'มัทฉะ']]) {
    h += `<tr><td colspan="${allMonths.length + 1}" style="font-weight:500;color:var(--text-secondary)">${title}</td></tr>`;
    const rows = [...names[kind].entries()].sort((a, b) => Object.values(b[1]).reduce((x, y) => x + y, 0) - Object.values(a[1]).reduce((x, y) => x + y, 0));
    const groups = kind === 'bean' ? [...ROAST_ORDER, null] : ['_'];
    for (const g of groups) {
      const gr = rows.filter(([n]) => kind !== 'bean' || (lvlOf.get(n) || null) === g);
      if (!gr.length) continue;
      if (kind === 'bean') h += `<tr><td colspan="${allMonths.length + 1}" style="color:var(--text-muted);font-size:12.5px">&nbsp;&nbsp;${g ? ROAST[g] : 'ไม่ทราบระดับคั่ว'}</td></tr>`;
      for (const [n, o] of gr) h += `<tr><td>${esc(n)}</td>${allMonths.map(x => `<td class="r">${o[x] ? nf0.format(o[x]) : ''}</td>`).join('')}</tr>`;
    }
  }
  $('#opt-trend').innerHTML = h + '</tbody></table>';
  renderBeanPerf();
}

function renderBeanPerf() {
  const el = $('#bean-perf'); if (!el) return;
  if (!D.beanPeriods.length) { el.innerHTML = '<p class="sub">ยังไม่มีตารางเปลี่ยนเมล็ด (bean_usage_periods) — จึงยังแยกเมล็ดจริงไม่ได้</p>'; return; }
  const S = D.beanSales.filter(x => ym(x.date) <= state.month);
  const openDays = D.daily.filter(r => num(r.store_bills) > 0 || num(r.grab_orders) > 0).map(r => r.business_date);
  const cupsByDay = {}; S.forEach(x => { cupsByDay[x.date] = (cupsByDay[x.date] || 0) + x.qty; });
  const win = new Map();   // period -> first/last sale credited to it
  S.forEach(x => { if (!x.p) return; const w = win.get(x.p) || { a: x.date, b: x.date }; if (x.date < w.a) w.a = x.date; if (x.date > w.b) w.b = x.date; win.set(x.p, w); });
  const beans = new Map(), key = p => p.roast_level + '|' + beanLabel(p);
  for (const [p, w] of win) {
    const b = beans.get(key(p)) || { p, level: p.roast_level, days: new Set(), wins: [], cups: 0, cost: 0, opts: new Set() };
    openDays.forEach(d => { if (d >= w.a && d <= w.b) b.days.add(d); }); b.wins.push(w); beans.set(key(p), b);
  }
  S.forEach(x => { if (!x.p) return; const b = beans.get(key(x.p)); b.cups += x.qty; b.cost += x.qty * num(x.p.cost_per_g); b.opts.add(x.opt); });
  const dm = d => `${+d.slice(8)}/${+d.slice(5, 7)}`;
  const unknown = S.filter(x => !x.p), lv = state.beanLevel;
  let h = `<table class="num"><thead><tr><th>เมล็ด</th><th>ช่วงที่ขาย</th><th class="r">วันเปิด</th><th class="r">แก้ว</th><th class="r">แก้ว/วัน</th><th class="r">% ตอนมีขาย</th><th class="r">ต้นทุน/shot</th></tr></thead><tbody>`;
  for (const g of ROAST_ORDER) {
    if (lv !== 'all' && lv !== g) continue;
    const rows = [...beans.values()].filter(b => b.level === g).map(b => { const all = [...b.days].reduce((t, d) => t + (cupsByDay[d] || 0), 0); return Object.assign(b, { perDay: b.days.size ? b.cups / b.days.size : 0, share: all ? b.cups / all : null }); })
      .sort((a, b) => b.perDay - a.perDay);
    if (!rows.length) continue;
    h += `<tr class="grp"><td colspan="7" style="font-weight:500;color:var(--text-secondary)">${ROAST[g]}</td></tr>`;
    for (const b of rows) h += `<tr><td>${esc(b.p.bean_name)}${b.p.roaster ? ` <span class="tag">${esc(b.p.roaster)}</span>` : ''}${b.p.pos_option ? '' : ''}</td>`
      + `<td style="white-space:nowrap">${b.wins.sort((x, y) => x.a < y.a ? -1 : 1).map(w => `${dm(w.a)}–${dm(w.b)}`).join(', ')}</td>`
      + `<td class="r">${b.days.size}</td><td class="r">${nf0.format(b.cups)}</td><td class="r">${nf1.format(b.perDay)}</td><td class="r">${pct(b.share)}</td><td class="r">${b.cups ? nf1.format(b.cost / b.cups * 20) : '–'}</td></tr>`;
  }
  if (unknown.length && lv === 'all') {
    const by = {}; unknown.forEach(x => { by[x.opt] = (by[x.opt] || 0) + x.qty; });
    h += `<tr class="grp"><td colspan="7" style="font-weight:500;color:var(--text-secondary)">ยังไม่รู้ว่าเป็นเมล็ดไหน</td></tr>`
      + Object.entries(by).map(([o, q]) => `<tr><td>POS: ${esc(o)}</td><td colspan="2" style="color:var(--text-muted)">ยังไม่ได้ผูกกับเมล็ด</td><td class="r">${nf0.format(q)}</td><td colspan="3"></td></tr>`).join('');
  }
  el.innerHTML = h + '</tbody></table>';
}

// ---------- P&L ----------
function renderPnl(v) {
  const months = allMonths(state.month);   // includes pre-opening months (setup costs before sales)
  const P = months.map(pnlOfMonth);
  const catLabel = k => k === '_none' ? 'ไม่ระบุหมวด' : (D.categories.find(c => c.key === k)?.label_th || k);
  const keysOf = grp => { const ks = new Set(); P.forEach(p => Object.keys(p.cats).forEach(k => { const g = k === '_none' ? 'other' : (D.categories.find(c => c.key === k)?.group_key || 'other'); if (g === grp || (grp === 'opex' && g !== 'variable')) ks.add(k); })); return [...ks].sort((a, b) => (D.categories.find(c => c.key === a)?.sort_order ?? 999) - (D.categories.find(c => c.key === b)?.sort_order ?? 999)); };

  const costH = (label, f) => `<tr><td>&nbsp;&nbsp;${label}</td>${P.map((p, i) => { const x = f(p); return `<td class="r ${months[i] === state.month ? 'sel' : ''}">${x ? '−' + baht(x) : ''}</td>`; }).join('')}</tr>`;

  html += head + 'รายได้</td></tr>' + money('&nbsp;&nbsp;หน้าร้าน', p => p.s.walk) + money('&nbsp;&nbsp;' + CH.gov, p => p.s.gov) + money('&nbsp;&nbsp;' + CH.grab + ' ยอดขาย (ราคาในแอป)', p => p.s.grabApp) + money('&nbsp;&nbsp;' + CH.lm + ' ยอดขาย (ราคาในแอป)' + (P.some(p => p.s.lmApp) ? '' : ' <span style="color:var(--text-muted)">ยังไม่มีข้อมูล</span>'), p => p.s.lmApp || null) + money('รายได้รวม', p => p.revenue, 'sum');
  html += head + 'ต้นทุนขาย</td></tr>' + keysOf('variable').map(k => cost(catLabel(k), p => p.cats[k] || 0)).join('') + costH('ค่าธรรมเนียม ' + CH.grab + ' (หักก่อนโอน)', p => p.grabFee) + (P.some(p => p.lmFee) ? costH('ค่าธรรมเนียม ' + CH.lm + ' (หักก่อนโอน)', p => p.lmFee) : '')
    + (P.some(p => p.inv.adj) ? `<tr><td>&nbsp;&nbsp;ปรับสต็อก (ต้นเดือน − ปลายเดือน)</td>${P.map((p, i) => `<td class="r ${months[i] === state.month ? 'sel' : ''}">${p.inv.adj ? (p.inv.adj > 0 ? '−' : '+') + baht(Math.abs(p.inv.adj)) : ''}</td>`).join('')}</tr>` : '');
  html += money('กำไรขั้นต้น', p => p.gross, 'sum') + `<tr><td>&nbsp;&nbsp;% ของรายได้</td>${P.map((p, i) => `<td class="r ${months[i] === state.month ? 'sel' : ''}">${p.revenue ? pct(p.gross / p.revenue) : ''}</td>`).join('')}</tr>`;
  html += head + 'ค่าใช้จ่ายดำเนินงาน (ตามบิลที่ลง)</td></tr>' + keysOf('opex').map(k => cost(catLabel(k), p => p.cats[k] || 0)).join('') + cost('ค่าเสื่อมทรัพย์สิน (คำนวณ)', p => p.dep);
  html += money('กำไรสุทธิ', p => p.net, 'sum total');
  if (salaryT) html += money(`มุมมองบริหาร: หลังหักเงินเดือนเป้า ${baht(salaryT)}`, p => p.net - salaryT, 'memo');
  html += '</tbody></table>';

  const planned = fixedPlanned(state.month), dep = depreciationOfMonth(state.month);
  const last3 = grossRatio(state.month).months;
  const avgCat = k => k ? last3.reduce((a, x) => a + (pnlOfMonth(x).cats[k] || 0), 0) / (last3.length || 1) : null;
  const fixedSum = planned.reduce((a, f) => a + num(f.monthly_amount), 0);
  // month column: defaults to the latest month with data every time the page opens
  const fm = state.fixedMonth && D.months.includes(state.fixedMonth) ? state.fixedMonth : D.months[D.months.length - 1];
  const fmCats = pnlOfMonth(fm).cats, fmDep = depreciationOfMonth(fm);
  const cmp = (actual, plan) => {   // lower cost than planned = good
    if (actual == null) return '';
    if (!plan && !actual) return '';

    const ch = (actual - plan) / plan;
    if (Math.abs(ch) < 0.03) return ' <span class="muted" title="ใกล้เคียงที่ตั้งไว้">≈</span>';
    return ch < 0 ? ` <span class="good" title="ต่ำกว่าที่ตั้งไว้ ${pct(-ch)} — ดีแล้ว">▼ ${pct(-ch)}</span>` : ` <span class="bad" title="สูงกว่าที่ตั้งไว้ ${pct(ch)}">▲ ${pct(ch)}</span>`;
  };
  const comparable = planned.filter(f => f.category_key && avgCat(f.category_key) > 0);   // only items that have bills

  const dash = '<span style="color:var(--text-muted)">–</span>';
  const monthSel = `<select id="fixed-month" aria-label="เลือกเดือนที่จะดู" style="font-size:12.5px;padding:2px 4px;border-radius:6px;border:1px solid var(--border);background:var(--surface-1)">${[...D.months].reverse().map(x => `<option value="${x}" ${x === fm ? 'selected' : ''}>${monthLabel(x)}</option>`).join('')}</select>`;

  v.innerHTML = `
    <div class="card"><h2>งบกำไรขาดทุนรายเดือน</h2><p class="sub">รายได้จาก POS และรายงาน Grab (ยอดขายเต็ม แล้วหักค่าธรรมเนียมเป็นต้นทุน) · รายจ่ายลงตามเดือนที่ใช้จริง (เช่นค่าไฟ ต.ค. ที่จ่ายใน พ.ย. อยู่ ต.ค.) · ต้นทุนขายตอนนี้คิดตามบิลซื้อ จนกว่าจะมีสต็อกปลายเดือนจาก POS แล้วจะปรับเป็นต้นทุนที่ใช้จริง · ค่าเสื่อมเริ่มนับตั้งแต่วันเปิดร้าน (22 พ.ค. 2569) · การคืนหนี้และเงินเดือนเจ้าของไม่ใช่รายจ่าย (ดูหน้ากระแสเงินสด) · พ.ค. = เดือนทดลอง</p>
      <div class="scroll">${html}</div></div>
    <div class="grid" style="margin-top:12px">
      <div class="card"><h2>ต้นทุนคงที่ต่อเดือน</h2><p class="sub">ที่ตั้งไว้ เทียบกับที่จ่ายจริงเฉลี่ย ${last3.map(monthLabel).join(', ')} และเดือนที่เลือก · ▼ เขียว = จ่ายต่ำกว่าที่ตั้ง (ดีแล้ว) · ▲ แดง = เกินที่ตั้ง</p>
        <div class="scroll"><table class="num"><thead><tr><th>รายการ</th><th class="r">ตั้งไว้/เดือน</th><th class="r">จ่ายจริงเฉลี่ย</th><th class="r">${monthSel}</th></tr></thead><tbody>
        ${planned.map(f => { const a = f.category_key ? avgCat(f.category_key) : null; const mo = f.category_key ? (fmCats[f.category_key] || 0) : null;
          return `<tr title="${esc(f.note || '')}"><td style="white-space:normal;min-width:120px">${esc(f.name)}</td><td class="r">${baht(f.monthly_amount)}</td><td class="r">${a == null ? dash : baht(a) + cmp(a, num(f.monthly_amount))}</td><td class="r">${mo == null ? dash : baht(mo)}</td></tr>`; }).join('')}
        <tr><td style="white-space:normal">ค่าเสื่อมทรัพย์สิน (คำนวณจากรายการทรัพย์สิน)</td><td class="r">${baht(dep)}</td><td class="r">${baht(dep)}</td><td class="r">${baht(fmDep)}</td></tr>
        <tr class="sum"><td style="white-space:normal">รวมรายการที่มีบิลให้เทียบ (${comparable.map(f => esc(f.name.replace(/^ค่า/, ''))).concat('ค่าเสื่อม').join(', ')})</td><td class="r">${baht(cPlan)}</td><td class="r">${baht(cAvg)}${cmp(cAvg, cPlan)}</td><td class="r">${baht(cMon)}</td></tr>
        <tr class="sum"><td>รวมต้นทุนคงที่ที่ตั้งไว้</td><td class="r">${baht(fixedSum + dep)}</td><td class="r"></td><td class="r"></td></tr>
        ${lvl ? `<tr class="grp"><td colspan="4" style="padding-top:12px;font-weight:500;color:var(--text-secondary)">ขั้นเป้าที่เลือก: ${esc(lvl.short)} <span class="sub">(เปลี่ยนได้ที่ปุ่มด้านล่าง หรือหน้าภาพรวม)</span></td></tr>

          ${lvl.parts.includes('rent') ? `<tr><td>ค่าเช่า (จำลอง)</td><td class="r">${baht(setting('rent'))}</td><td></td><td></td></tr>` : ''}
          <tr class="sum"><td style="white-space:normal">เงินสดที่ต้องหาให้ได้ต่อเดือน</td><td class="r">${baht(lvl.need)}</td><td></td><td></td></tr>` : ''}
        </tbody></table></div>
        ${lad ? `<div class="seg" id="pnl-goal" style="margin-top:8px;flex-wrap:wrap">${lad.levels.slice(1).map(x => `<button data-k="${x.id}" class="${x.id === lvl.id ? 'on' : ''}">${esc(x.short)}</button>`).join('')}</div>` : ''}

      <div class="card"><h2>กำไรสุทธิรายเดือน</h2><p class="sub">หลังค่าเสื่อม · ก่อนเงินเดือนเจ้าของ</p><div class="chart-box"><canvas id="c-net"></canvas></div></div>
    </div>`;
  const o = baseChartOptions(); o.scales.y.beginAtZero = true;

  const pg = $('#pnl-goal'); if (pg) pg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.goalLevel = Number(b.dataset.k); try { localStorage.setItem('bb-dash-goal', b.dataset.k); } catch (_) {} const y = window.scrollY; render(); window.scrollTo({ top: y }); });

  charts.push(new Chart($('#c-net'), { type: 'bar', data: { labels: months.map(monthLabel), datasets: [{ label: 'กำไรสุทธิ', data: P.map(p => Math.round(p.net)), backgroundColor: P.map(p => p.net < 0 ? css('--critical') : css('--series-1')), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 44 }] }, options: o }));
}

// ---------- balance sheet ----------
function renderBalance(v) {
  const m = state.month; const asOf = addMonths(m, 1) + '-01';   // end of the selected month
  const active = D.assets.filter(a => a.purchase_date < asOf && !(a.status === 'disposed' && a.disposed_date && a.disposed_date < asOf));
  let price = 0, acc = 0; const byCat = new Map();
  for (const a of active) { const x = assetValue(a, asOf); price += num(a.purchase_price); acc += x.acc; const cn = ASSET_CAT[a.category] || a.category || 'อื่นๆ'; const c = byCat.get(cn) || { book: 0, n: 0, price: 0, acc: 0, items: [] }; c.book += x.book; c.price += num(a.purchase_price); c.acc += x.acc; c.n++; c.items.push({ a, x }); byCat.set(cn, c); }
  const book = price - acc;
  const latestBal = new Map();
  for (const b of D.balances) { if (b.as_of >= asOf) continue; const cur = latestBal.get(b.payment_account_id); if (!cur || b.as_of > cur.as_of) latestBal.set(b.payment_account_id, b); }
  const cash = [...latestBal.values()].reduce((t, b) => t + num(b.balance), 0);
  const ownerOwes = D.ownerEntries.filter(e => e.direction === 'owner_owes_shop' && e.status === 'active').reduce((t, e) => t + num(e.amount), 0);
  const debts = new Map();
  for (const l of D.liabilities) { const out = num(l.original_amount) - num(l.paid_amount); if (out <= 0.005 || l.status === 'paid') continue; const k = l.creditor_name || 'ไม่ระบุ'; const d = debts.get(k) || { out: 0, n: 0, type: l.creditor_type }; d.out += out; d.n++; debts.set(k, d); }
  const debtTotal = [...debts.values()].reduce((t, d) => t + d.out, 0);
  const stock = stockValue(asOf);
  const totalAssets = book + cash + ownerOwes + (stock ? stock.value : 0), equity = totalAssets - debtTotal;
  const eq = equityBooks(m);
  const accName = id => D.accounts.find(a => a.id === id)?.label_th || 'บัญชี';
  const cats = [...byCat.entries()].sort((a, b) => b[1].book - a[1].book);
  const lifeTxt = a => num(a.useful_life_months) > 0 ? `${num(a.useful_life_months)} ด.` : 'ไม่คิด';
  const assetDetail = cats.map(([name, c]) => `<details><summary><span class="l">${esc(name)} <span class="tag">${c.n} รายการ</span></span><span class="num">${baht(c.book)}</span></summary>
    <div class="scroll maxh"><table class="num"><thead><tr><th>รายการ</th><th>ซื้อเมื่อ</th><th class="r">ราคาซื้อ</th><th class="r">อายุใช้งาน</th><th class="r">เสื่อมไปแล้ว</th><th class="r">มูลค่าคงเหลือ</th></tr></thead><tbody>
    ${c.items.sort((p, q) => q.x.book - p.x.book || num(q.a.purchase_price) - num(p.a.purchase_price)).map(({ a, x }) => `<tr><td style="white-space:normal;min-width:140px">${esc(a.name)}</td><td>${thDate(a.purchase_date)}</td><td class="r">${baht(a.purchase_price)}</td><td class="r">${lifeTxt(a)}</td><td class="r">${baht(x.acc)}</td><td class="r">${baht(x.book)}</td></tr>`).join('')}
    <tr class="sum"><td>รวม</td><td></td><td class="r">${baht(c.price)}</td><td></td><td class="r">${baht(c.acc)}</td><td class="r">${baht(c.book)}</td></tr></tbody></table></div></details>`).join('');
  const cashAccounts = D.accounts.filter(a => ['scb', 'ktb', 'krungsri', 'cash'].includes(a.key) || D.balances.some(b => b.payment_account_id === a.id)).sort((a, b) => a.sort_order - b.sort_order);
  const cashDetail = cashAccounts.map(acct => {
    const hist = D.balances.filter(b => b.payment_account_id === acct.id && b.as_of < asOf).sort((a, b) => b.as_of.localeCompare(a.as_of));
    const last = hist[0];
    return `<details><summary><span class="l">${esc(acct.label_th)}${last ? ` <span class="tag">ณ ${thDate(last.as_of)}</span>` : ''}</span><span class="num">${last ? baht(last.balance) : '<span style="color:var(--text-muted)">ยังไม่นับ</span>'}</span></summary>
      ${hist.length ? `<div class="scroll"><table class="num"><thead><tr><th>วันที่นับ</th><th class="r">ยอด</th><th>หมายเหตุ</th></tr></thead><tbody>${hist.map(b => `<tr><td>${thDate(b.as_of)}</td><td class="r">${baht(b.balance)}</td><td style="white-space:normal">${esc(b.note || '')}</td></tr>`).join('')}</tbody></table></div>` : '<p class="sub">ยังไม่มียอดนับของบัญชีนี้ — จะลงได้จากหน้าหลังบ้าน (ยอดนับ safe / ยอดคงเหลือธนาคาร)</p>'}</details>`;
  }).join('');

  v.innerHTML = `
    <div class="rowflex"><div><h2>งบดุล ณ สิ้น ${monthLabelLong(m)}</h2><p class="sub">ทรัพย์สินหักค่าเสื่อมแบบเส้นตรงรายเดือน · หนี้ = ยอดตั้งต้น − ที่จ่ายแล้ว</p></div></div>
    <div class="grid kpis">
      <div class="card kpi"><div class="label">มูลค่าทรัพย์สินในร้าน (สุทธิ)</div><div class="value num">${baht(book)} ฿</div><div class="delta">ซื้อมา ${baht(price)} − เสื่อมไปแล้ว ${baht(acc)} · <a class="more" href="#" data-goto="assets">ดูรายชิ้น →</a></div></div>

// equity built from its parts: capital + accumulated profit − drawings (up to the end of month m)
function equityBooks(m) {
  const end = addMonths(m, 1) + '-01', ms = allMonths(m);
  const sum = dir => D.ownerEntries.filter(e => e.direction === dir && e.status !== 'void' && (e.entry_date || '') < end).reduce((t, e) => t + num(e.amount), 0);
  const capital = sum('capital'), drawings = sum('drawing');
  const re = ms.reduce((t, x) => t + pnlOfMonth(x).net, 0);
  return { capital, drawings, re, books: capital + re - drawings, from: ms[0] };
}

// cash reserve status (Reporting-Direction §10: working cash in SCB + reserve targets)
function reserveHtml(m, cash) {
  if (cash == null) return '';

// ---------- payback simulator ----------
function simStart() {
  const nowM = ym(D.lastSale), asOf = addMonths(nowM, 1) + '-01';
  const debtOwner = D.liabilities.filter(l => l.creditor_type === 'owner').reduce((t, l) => t + Math.max(0, num(l.original_amount) - num(l.paid_amount)), 0);
  const debtOther = D.liabilities.filter(l => l.creditor_type !== 'owner').reduce((t, l) => t + Math.max(0, num(l.original_amount) - num(l.paid_amount)), 0);
  const latest = new Map(); for (const b of D.balances) { const c = latest.get(b.payment_account_id); if (!c || b.as_of > c.as_of) latest.set(b.payment_account_id, b); }
  const cash = [...latest.values()].reduce((t, b) => t + num(b.balance), 0);
  const cashDate = [...latest.values()].reduce((m, b) => b.as_of > m ? b.as_of : m, '');
  const recv = D.ownerEntries.filter(e => e.direction === 'owner_owes_shop' && e.status === 'active').reduce((t, e) => t + num(e.amount), 0);
  const book = D.assets.filter(a => a.status !== 'disposed' && a.purchase_date < asOf).reduce((t, a) => t + assetValue(a, asOf).book, 0);
  // defaults = last 3 complete months (trial May and the month in progress excluded)
  const ms = grossRatio(nowM).months; let st = 0, od = 0, go = 0;
  for (const x of ms) { const s = salesOfMonth(x); st += s.store; od += s.openDays; go += s.grabOrders; }
  const cur = salesOfMonth(nowM);
  return { nowM, debtOwner, debtOther, cash, cashDate, recv, book, ms, storeDay: od ? st / od : 0, grabMonth: ms.length ? go / ms.length : 0,
    curStoreDay: cur.openDays ? cur.store / cur.openDays : 0, curGrabMonth: cur.openDays ? cur.grabOrders / cur.openDays * planDays(nowM, targetFor(nowM)) : 0 };
}

// ---------- cash flow statement (direct method, from recorded transactions) ----------
function cashFlowOfMonth(m) {
  const s = salesOfMonth(m), inShop = id => !id || D.shopAcct.has(id);
  const opPaid = D.expenses.filter(e => ym(e.expense_date) === m && inShop(e.payment_account_id)).reduce((t, e) => t + num(e.amount), 0);
  const ownerPaidExp = D.expenses.filter(e => ym(e.expense_date) === m && !inShop(e.payment_account_id)).reduce((t, e) => t + num(e.amount), 0);
  const capex = D.assets.filter(a => ym(a.purchase_date) === m && inShop(a.payment_account_id)).reduce((t, a) => t + num(a.purchase_price), 0);
  const ownerPaidAssets = D.assets.filter(a => ym(a.purchase_date) === m && !inShop(a.payment_account_id)).reduce((t, a) => t + num(a.purchase_price), 0);
  const repay = D.liabPayments.filter(x => ym(x.payment_date) === m && inShop(x.payment_account_id)).reduce((t, x) => t + num(x.amount), 0);
  const ent = dir => D.ownerEntries.filter(e => e.direction === dir && e.entry_date && ym(e.entry_date) === m).reduce((t, e) => t + num(e.amount), 0);
  const drawings = ent('drawing'), personal = ent('owner_owes_shop'), ownerBack = ent('settlement');
  const salesIn = s.store, grabIn = s.grab, lmIn = s.lineman;
  const op = salesIn + grabIn + lmIn - opPaid, inv = -capex, fin = -drawings - repay - personal + ownerBack;
  return { m, salesIn, grabIn, lmIn, opPaid, op, capex, inv, drawings, repay, personal, ownerBack, fin, net: op + inv + fin, ownerPaidExp, ownerPaidAssets };
}

// ---------- depreciation schedule (past + projected until every asset is fully depreciated) ----------
function idxToMonth(i) { return `${Math.floor(i / 12)}-${String(i % 12 + 1).padStart(2, '0')}`; }
function depSchedule() {
  let lo = Infinity, hi = -Infinity; const items = [];
  for (const a of D.assets) {
    const life = num(a.useful_life_months); if (!(life > 0)) continue;
    const s = monthIndex(depStart(a));
    const end = Math.min(s + life - 1, a.status === 'disposed' && a.disposed_date ? monthIndex(a.disposed_date) - 1 : Infinity);
    items.push({ a, s, end, per: num(a.purchase_price) / life, cat: ASSET_CAT[a.category] || a.category || 'อื่นๆ' });
    lo = Math.min(lo, s); hi = Math.max(hi, end);
  }
  const cats = [...new Set(items.map(x => x.cat))];
  const rows = []; let acc = 0;
  const totalPrice = items.reduce((t, x) => t + num(x.a.purchase_price), 0);
  for (let i = lo; i <= hi; i++) {
    const r = { i, m: idxToMonth(i), byCat: {}, total: 0 };
    for (const x of items) if (i >= x.s && i <= x.end) { r.byCat[x.cat] = (r.byCat[x.cat] || 0) + x.per; r.total += x.per; }
    acc += r.total; r.acc = acc; r.book = totalPrice - acc; rows.push(r);
  }
  return { rows, cats, items };
}
function renderDepSchedule(selMonth) {
  const { rows, cats, items } = depSchedule(); const el = $('#dep-schedule'); if (!rows.length) { el.innerHTML = ''; return; }
  const nowM = ym(D.lastSale || selMonth), pick = state.depMonth || selMonth;
  const colors = ['--series-1', '--series-2', '--series-3'];
  const lastDrop = rows.filter(r => r.m > nowM).find((r, k, arr) => k > 0 && r.total < arr[k - 1].total - 0.5);
  el.innerHTML = `<h2>ค่าเสื่อมรายเดือน</h2>
    <p class="sub">ตั้งแต่เดือนที่เริ่มใช้งาน จนถึงเดือนที่ของชิ้นสุดท้ายหมดค่าเสื่อม (${monthLabelLong(rows[rows.length - 1].m)}) · หลังเดือนปัจจุบันเป็นประมาณการ (ถ้าไม่ซื้อของเพิ่ม) · ค่าเสื่อมไม่ใช่เงินสดที่จ่ายออก${lastDrop ? ` · ค่าเสื่อมเริ่มลดลงเมื่อ ${monthLabelLong(lastDrop.m)} เพราะของชุดแรกครบอายุ` : ''}</p>
    ${legend(cats.map((c, k) => [css(colors[k % 3]), c, 1]))}
    <div class="chart-box"><canvas id="c-dep"></canvas></div>
    <p class="sub" style="margin-top:8px">กดเดือนในตารางเพื่อดูว่าชิ้นไหนคิดค่าเสื่อมเดือนนั้น</p>
    <div class="scroll maxh"><table class="num" id="dep-table"><thead><tr><th>เดือน</th>${cats.map(c => `<th class="r">${esc(c)}</th>`).join('')}<th class="r">รวม/เดือน</th><th class="r">สะสม</th><th class="r">มูลค่าคงเหลือ*</th></tr></thead><tbody>
    ${rows.map(r => `<tr data-m="${r.m}" class="${r.m === pick ? 'sel' : ''}" style="cursor:pointer;${r.m > nowM ? 'color:var(--text-muted)' : ''}"><td>${monthLabel(r.m)}${r.m === nowM ? ' <span class="tag">ปัจจุบัน</span>' : ''}</td>${cats.map(c => `<td class="r">${r.byCat[c] ? baht(r.byCat[c]) : ''}</td>`).join('')}<td class="r">${baht(r.total)}</td><td class="r">${baht(r.acc)}</td><td class="r">${baht(r.book)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="sub">* มูลค่าคงเหลือเฉพาะของที่คิดค่าเสื่อม (ไม่รวมของชิ้นเล็กที่ไม่คิดค่าเสื่อม)</p>
    <div id="dep-month-detail"></div>`;
  const showMonth = mm => {
    const i = monthIndex(mm + '-01');
    const list = items.filter(x => i >= x.s && i <= x.end).sort((p, q) => q.per - p.per);
    $('#dep-month-detail').innerHTML = `<h3 style="margin-top:12px">${monthLabelLong(mm)}: ${list.length} ชิ้น รวม ${baht(list.reduce((t, x) => t + x.per, 0))} ฿</h3>
      <div class="scroll maxh"><table class="num"><thead><tr><th>รายการ</th><th>หมวด</th><th class="r">ค่าเสื่อม/เดือน</th><th class="r">เดือนที่</th><th class="r">ครบอายุ</th></tr></thead><tbody>
      ${list.map(x => `<tr><td style="white-space:normal;min-width:140px">${esc(x.a.name)}</td><td>${esc(x.cat)}</td><td class="r">${nf2.format(x.per)}</td><td class="r">${i - x.s + 1}/${num(x.a.useful_life_months)}</td><td>${monthLabel(idxToMonth(x.end))}</td></tr>`).join('')}
      </tbody></table></div>`;
  };
  showMonth(rows.some(r => r.m === pick) ? pick : nowM);
  $('#dep-table').addEventListener('click', e => { const tr = e.target.closest('tr[data-m]'); if (!tr) return; state.depMonth = tr.dataset.m; document.querySelectorAll('#dep-table tr.sel').forEach(x => x.classList.remove('sel')); tr.classList.add('sel'); showMonth(tr.dataset.m); });
  const sel = $('#dep-table tr.sel'); if (sel) sel.scrollIntoView({ block: 'nearest' });
  const o = baseChartOptions(); o.scales.x.stacked = true; o.scales.y.stacked = true;
  o.scales.x.ticks.maxTicksLimit = 12;
  o.plugins.tooltip.callbacks = { title: it => monthLabelLong(rows[it[0].dataIndex].m) + (rows[it[0].dataIndex].m > nowM ? ' (ประมาณการ)' : ''), label: c => ` ${c.dataset.label}: ${baht(c.raw)} ฿`, footer: it => `รวม ${baht(it.reduce((t, x) => t + x.raw, 0))} ฿/เดือน` };
  charts.push(new Chart($('#c-dep'), { type: 'bar', data: { labels: rows.map(r => monthLabel(r.m)), datasets: cats.map((c, k) => ({
    label: c, data: rows.map(r => Math.round(r.byCat[c] || 0)), stack: 's', borderRadius: 3, borderSkipped: 'start', borderColor: css('--surface-1'), borderWidth: { top: 1 },
    backgroundColor: rows.map(r => r.m > nowM ? css(colors[k % 3]) + '66' : css(colors[k % 3])) })) }, options: o }));
}

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault(); $('#login-err').hidden = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value, password: $('#password').value });
  if (error) { $('#login-err').textContent = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'; $('#login-err').hidden = false; return; }
  start();
});

(async () => {
  if (MOCK_URL) return start();
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(); else $('#login').hidden = false;
})();
</script>
</body>
</html>
