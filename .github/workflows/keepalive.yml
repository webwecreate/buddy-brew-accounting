name: Supabase Keepalive

# ยิง query เบาๆ เข้า DB ทุก 3 วัน กัน Supabase Free plan หยุดโปรเจกต์เมื่อไม่มีการใช้งาน 7 วัน
# ใช้ publishable key (เป็นคีย์สาธารณะ ฝังอยู่ใน accounting.html อยู่แล้ว) ไม่ต้องใช้ secret
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call accounting_keepalive()
        run: |
          curl --fail-with-body -sS -X POST \
            "https://xsokynhtoxktazlomsnx.supabase.co/rest/v1/rpc/accounting_keepalive" \
            -H "apikey: sb_publishable_r-BdEYs8q61oSQKv_qJpPw_Xh5BPgRa" \
            -H "Content-Type: application/json" \
            -d '{}'
